name: Check PR Label

on:
    pull_request:
        types: [opened, labeled, unlabeled, synchronize]

jobs:
    check-label:
        runs-on: ubuntu-latest
        steps:
            - name: Check if PR has a label
              env:
                  LABELS: ${{ toJson(github.event.pull_request.labels) }}
              run: |
                  COUNT=$(echo "$LABELS" | jq 'length')
                  if [ "$COUNT" -eq "0" ]; then
                    echo "This PR has no labels. Please add at least one label before merging."
                    exit 1
                  else
                    echo "PR has $COUNT label(s). Check passed."
                  fi
